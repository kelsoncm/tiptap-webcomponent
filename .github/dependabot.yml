version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tiptap:
        patterns: ['@tiptap/*', '@kelsoncm/*']
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ['@tiptap/*', '@kelsoncm/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
