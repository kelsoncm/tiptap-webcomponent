<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kelsoncm-tiptap demo</title>
    <style>
      body {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 16px;
        font-family: system-ui, sans-serif;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        font-weight: 600;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: #f6f6f6;
        padding: 8px;
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>&lt;kelsoncm-tiptap&gt;</h1>
    <form id="form">
      <label for="descricao">Descrição do edital</label>
      <kelsoncm-tiptap
        id="descricao"
        name="descricao"
        required
        toolbar="basic"
        max-words="200"
        placeholder="Descreva o edital…"
      ></kelsoncm-tiptap>

      <label>Observações (modo balão, somente leitura alternável)</label>
      <kelsoncm-tiptap id="obs" name="obs" mode="balloon" toolbar="minimal">
        <p>Selecione um trecho para ver o <strong>balão</strong>.</p>
      </kelsoncm-tiptap>

      <div class="row">
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <button type="button" id="toggle">Alternar somente leitura</button>
        <select id="locale">
          <option>pt-BR</option>
          <option>en</option>
          <option>es</option>
        </select>
      </div>
    </form>
    <h2>FormData enviado</h2>
    <pre id="out">—</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
